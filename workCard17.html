<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <title>Название работы — Андрей Куренбин</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="mainpaper12.css" />
</head>

<body>

  <section class="work-detail">
    <div class="container">
      <h1 class="section-title">Название работы</h1>
      <p class="section-subtitle">Материал · размеры · год создания</p>

      <div class="work-detail-text-only">
        <p>
          Здесь общий текст о работе: идея, задача заказчика, особенности,
          как строился процесс.
        </p>
        <p>
          Можно добавить пару абзацев про материалы, сроки, установку и т.п.
        </p>
      </div>
    </div>
  </section>

  <section class="work-gallery">
    <div class="container">
      <div class="work-gallery-grid">
        <img src="img/высокийЧел.jpg" alt="Фото работы 1">
        <img src="img/высокийЧел2.jpg" alt="Фото работы 2">
        <img src="img/высокийЧел3.jpg" alt="Фото работы 3">
        <!-- добавляй сколько нужно -->
      </div>
    </div>
  </section>

  <div class="work-nav">
    <a href="index.html" class="btn-ghost work-back-btn">← Назад к работам</a>
    <a href="workCard16.html" class="btn-ghost work-back-btn">← Предыдущая</a>
    <a href="workCard18.html" class="btn-primary work-next-btn">Следующая работа →</a>
  </div>
  
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Закрыть просмотр">&times;</button>
    <button class="lightbox-arrow lightbox-prev" aria-label="Предыдущая работа">‹</button>
    <img class="lightbox-image" src="" alt="">
    <button class="lightbox-arrow lightbox-next" aria-label="Следующая работа">›</button>
  </div>

  <script>
    (function () {
      const galleryImages = Array.from(document.querySelectorAll('.work-gallery-grid img'));
      if (!galleryImages.length) return;

      const lightbox = document.getElementById('lightbox');
      const lightboxImage = lightbox.querySelector('.lightbox-image');
      const closeBtn = lightbox.querySelector('.lightbox-close');
      const prevBtn = lightbox.querySelector('.lightbox-prev');
      const nextBtn = lightbox.querySelector('.lightbox-next');

      let currentIndex = 0;

      function updateImage() {
        const img = galleryImages[currentIndex];
        lightboxImage.src = img.src;
        lightboxImage.alt = img.alt || '';
      }

      function openLightbox(index) {
        currentIndex = index;
        updateImage();
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      function changeImage(delta) {
        const total = galleryImages.length;
        currentIndex = (currentIndex + delta + total) % total;
        updateImage();
      }

      galleryImages.forEach((img, index) => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => openLightbox(index));
      });

      closeBtn.addEventListener('click', closeLightbox);

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });

      prevBtn.addEventListener('click', () => changeImage(-1));
      nextBtn.addEventListener('click', () => changeImage(1));

      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('is-open')) return;

        if (e.key === 'Escape') {
          closeLightbox();
        } else if (e.key === 'ArrowLeft') {
          changeImage(-1);
        } else if (e.key === 'ArrowRight') {
          changeImage(1);
        }
      });
    })();
  </script>

</body>

</html>
